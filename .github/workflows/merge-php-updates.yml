name: Merge PHP Update PRs

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to merge (e.g., 8.2, 8.3, 8.4, 8.5, or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
      merge_method:
        description: 'Merge method'
        required: true
        default: 'squash'
        type: choice
        options:
          - 'squash'
          - 'merge'
          - 'rebase'

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  merge:
    name: Merge PHP Update PRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Merge all PHP update PRs
        if: inputs.php_version == 'all'
        shell: bash
        run: |
          echo "Merging all PHP update PRs..."
          gh pr list --base main --head "update-php-*" --json number,title --jq '.[] | .number' | while read pr_number; do
            if [ -n "$pr_number" ]; then
              echo "Merging PR #$pr_number"
              gh pr merge "$pr_number" --${{ inputs.merge_method }} --auto || echo "Failed to merge PR #$pr_number"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Merge specific PHP version PRs
        if: inputs.php_version != 'all'
        shell: bash
        run: |
          echo "Merging PHP ${{ inputs.php_version }} update PRs..."
          gh pr list --base main --head "update-php-${{ inputs.php_version }}-*" --json number,title --jq '.[] | .number' | while read pr_number; do
            if [ -n "$pr_number" ]; then
              echo "Merging PR #$pr_number"
              gh pr merge "$pr_number" --${{ inputs.merge_method }} --auto || echo "Failed to merge PR #$pr_number"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
